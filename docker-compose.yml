services:
  postgres:
    image: postgres:17
    container_name: energy-ai-postgres
    environment:
      POSTGRES_DB: energy_ai
      POSTGRES_USER: energy_ai
      POSTGRES_PASSWORD: energy_ai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: