services:
  postgres:
    image: postgres:17
    container_name: energy-ai-postgres
    environment:
      POSTGRES_DB: energy_ai
      POSTGRES_USER: energy_ai
      POSTGRES_PASSWORD: energy_ai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: energy-ai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data: